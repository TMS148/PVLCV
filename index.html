        .container {
            max-width: 850px;

            display: flex;

            justify-content: center;

            margin-bottom: 20px;

        .kia-logo {
            height: 28px;
            width: auto;
            display: block;
        }

            text-align: center;
            color: #ffffff;
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 1px;
        }
        .section {
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 18px;
            background: #ffffff;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);

        .section-title {
            font-size: 1.05rem;
            font-weight: bold;
            margin-bottom: 14px;
            color: #050505;
            border-bottom: 2.5px solid var(--primary);
            padding-bottom: 4px;
            display: inline-block;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        input, select, textarea {
            padding: 9px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 0.95rem;
            width: 100%;
            box-sizing: border-box;
        }
        .uppercase-input {
            text-transform: uppercase;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0,86,179,0.25);
        }
        .part-block {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .part-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 8px;
        }
        .part-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 8px;
            margin-bottom: 8px;
        }
        .vlt-subgrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
            background: #ffffff;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #ced4da;
            margin-top: 6px;
        }
        .part-number-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #eef2f7;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 8px;
        }
        .part-number-text {
            font-family: monospace;
            font-weight: bold;
            color: #d63384;
            flex-grow: 1;
            word-break: break-all;
            font-size: 1rem;
        }
        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .btn:hover { background: #004085; }
        .btn-success { background: var(--success); }
        .btn-success:hover { background: #218838; }
        .alert {
            color: var(--warning);
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 6px;
            display: none;
            background: #fdf2f2;
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #f8b4b4;
        }
        textarea {
            resize: vertical;
            min-height: 200px;
            font-size: 0.95rem;
            line-height: 1.5;
            background-color: #f8f9fa;
        }
        .btn-copy-main {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            margin-top: 10px;
        }
        .car-hint {
            font-size: 0.75rem;
            color: #6c757d;
            margin-top: 2px;
        }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            color: white;

// --- 程式初始化讀取 Excel ---
async function loadExcelData() {
try {
const cacheBuster = ?v=${Date.now()};
let response = await fetch(database.xlsx${cacheBuster});
if (!response.ok) throw new Error("找不到 database.xlsx");
let arrayBuffer = await response.arrayBuffer();
let workbook = XLSX.read(arrayBuffer, { type: 'array' });
let filmSheetName = workbook.SheetNames.find(n => n.includes('隔熱紙') || n.toLowerCase().includes('film') || n.toLowerCase().includes('part')) || workbook.SheetNames[0];
let rawFilmJson = XLSX.utils.sheet_to_json(workbook.Sheets[filmSheetName]);
PV_DATABASE = rawFilmJson.map(row => {
let brand = String(row['品牌'] || row['brand'] || '').trim();
let rawPos = String(row['位置'] || row['part_type'] || '').trim();
let partType = (rawPos === '前檔') ? '前擋' : rawPos;
let series = String(row['系列'] || row['series'] || '').trim();
let partNo = String(row['件號'] || row['part_no'] || '').trim();
let rawCars = String(row['車型 / 規格'] || row['車型/規格'] || row['車型'] || row['raw_cars'] || row['cars'] || '').trim();
let cars = rawCars.split(/[,/]+/).map(c => c.trim()).filter(Boolean);
let rawVlts = String(row['透光度'] || row['vlts'] || '').trim();
let vlts = rawVlts.split(/[,.\s]+/).map(v => v.trim()).filter(Boolean);
return { brand, part_type: partType, series, part_no: partNo, raw_cars: rawCars, cars, vlts };
});
let modelSheetName = workbook.SheetNames.find(n => n.includes('車型') || n.toLowerCase().includes('model'));
if (modelSheetName) {
parsePVModels(workbook.Sheets[modelSheetName]);
} else if (workbook.SheetNames.length > 1) {
parsePVModels(workbook.Sheets[workbook.SheetNames[1]]);
}
// 預設以 PV 模式初始化介面
switchMode('PV');
document.getElementById('loading').style.display = 'none';
} catch (err) {
console.error("載入 Excel 失敗，將以預設 LCV 模式運作或提示錯誤", err);
alert("載入 database.xlsx 失敗，請確認 PV 版的 Excel 檔案放置於正確目錄！目前預設可運作卡旺商車版。");
document.getElementById('loading').style.display = 'none';
switchMode('PV');
}
}
function parsePVModels(worksheet) {
let rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
PV_CAR_MODELS = [];
PV_VIN_PREFIX_MAP = {};
if (rows.length < 2) return;
let header = rows[0].map(h => String(h || '').trim().toUpperCase());
let codeIdx = header.findIndex(h => h.includes('車型') || h.includes('代碼') || h === 'CODE');
let nameIdx = header.findIndex(h => h.includes('商品名') || h.includes('車款') || h === 'NAME');
let vinIdx = header.findIndex(h => h.includes('VIN'));
if (codeIdx === -1) codeIdx = 0;
if (nameIdx === -1) nameIdx = 1;
if (vinIdx === -1) vinIdx = 2;
for (let i = 1; i < rows.length; i++) {
let row = rows[i];
if (!row || row.length === 0) continue;
let code = String(row[codeIdx] || '').trim();
let name = String(row[nameIdx] || '').trim();
let vinPrefix = String(row[vinIdx] || '').trim().toUpperCase();
if (!code) continue;
let displayText = name ? ${code} - ${name} : code;
PV_CAR_MODELS.push({ code, name, vinPrefix, displayText });
if (vinPrefix) PV_VIN_PREFIX_MAP[vinPrefix] = displayText;
}
}

function cleanSeriesName(name) {
return name ? name.replace(/系列$/g, '') : '';
}
function checkModelMatch(userCarModel, item) {
if (!userCarModel) return true;
const userCode = userCarModel.split(' - ')[0].trim().toUpperCase();
if (item.cars.some(c => c.toUpperCase() === userCode)) return true;
const rawUpper = item.raw_cars.toUpperCase();
if (rawUpper === userCode || rawUpper.includes(userCode)) return true;
return false;
}
// --- 監聽車身碼輸入事件 (包含自動分流判斷) ---
function onVinInput() {
const vinInput = document.getElementById('vin');
let cleanedValue = vinInput.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
vinInput.value = cleanedValue;
const vinAlert = document.getElementById('vin-alert');
if (cleanedValue.length > 0 && cleanedValue.length !== 17) {
vinAlert.style.display = 'block';
} else {
vinAlert.style.display = 'none';
}
// 核心判斷：輸入滿 4 碼時進行車身碼前四碼分流
if (cleanedValue.length >= 4) {
const prefix4 = cleanedValue.substring(0, 4);
if (prefix4 === 'KNCS') {
// 自動切換為 LCV 卡旺商用車版
switchMode('LCV');
} else {
// 其餘狀況維持或切回 PV 乘用車版
switchMode('PV');
}
} else {
// 未滿4碼時預設回主管要求的 PV 版主頁
switchMode('PV');
}
// 各版本獨立的 VIN 第 6 碼連動邏輯
if (CURRENT_MODE === 'LCV' && cleanedValue.length >= 6) {
const char6 = cleanedValue.charAt(5);
const carModelSelect = document.getElementById('carModel');
if (char6 === 'X') carModelSelect.value = "單廂";
else if (char6 === 'Y') carModelSelect.value = "雙廂";
else if (char6 === 'Z') carModelSelect.value = "大單廂";
onCarModelChange();
}
else if (CURRENT_MODE === 'PV' && cleanedValue.length >= 4) {
const prefix4 = cleanedValue.substring(0, 4);
const matchedModel = PV_VIN_PREFIX_MAP[prefix4];
if (matchedModel) {
const carModelSelect = document.getElementById('carModel');
for (let i = 0; i < carModelSelect.options.length; i++) {
if (carModelSelect.options[i].value === matchedModel) {
if (carModelSelect.selectedIndex !== i) {
carModelSelect.selectedIndex = i;
onCarModelChange();
}
break;
}
}
}
}
updateNote();
}
function checkVinModelMismatch() {
if (CURRENT_MODE !== 'LCV') return; // 原PV版無此警示機制，僅LCV有
const vin = document.getElementById('vin').value.trim().toUpperCase();
const carModel = document.getElementById('carModel').value;
const alertElem = document.getElementById('model-mismatch-alert');
if (vin.length >= 6 && carModel) {
const char6 = vin.charAt(5);
let expectedModel = "";
if (char6 === 'X') expectedModel = "單廂";
else if (char6 === 'Y') expectedModel = "雙廂";
else if (char6 === 'Z') expectedModel = "大單廂";
if (expectedModel && expectedModel !== carModel) {
alertElem.style.display = 'block';
} else {
alertElem.style.display = 'none';
}
} else {
alertElem.style.display = 'none';
}
}
// --- 車型選擇變更事件 ---
function onCarModelChange() {
const carModel = document.getElementById('carModel').value;
if (CURRENT_MODE === 'LCV') {
checkVinModelMismatch();
const singleContainer = document.getElementById('lcv-single-vlt-container');
const doubleContainer = document.getElementById('lcv-double-vlt-container');
if (carModel === "雙廂") {
singleContainer.style.display = 'none';
doubleContainer.style.display = 'grid';
} else {
singleContainer.style.display = 'grid';
doubleContainer.style.display = 'none';
}
['front', 'body'].forEach(p => {
const brandVal = document.getElementById(${p}-brand).value;
if (brandVal) onBrandChange(p);
else updatePartInfo(p);
});
} else {
['front', 'body', 'sunroof'].forEach(p => {
const brand = document.getElementById(${p}-brand).value;
const series = document.getElementById(${p}-series).value;
if (brand && series) onSeriesChange(p);
else updatePartInfo(p);
});
}
updateNote();
}
// --- 品牌選擇變更事件 ---
function onBrandChange(partKey) {
const brandVal = document.getElementById(${partKey}-brand).value;
const partType = PART_TYPES_MAP[partKey];
const specSelect = document.getElementById(${partKey}-spec);
if (CURRENT_MODE === 'LCV') {
// LCV 模式：原來的 onBrandSeriesChange 邏輯
specSelect.innerHTML = '-- 請選擇適用車型 --';
clearVltSelects(partKey);
if (brandVal) {
const [brand, series] = brandVal.split('|');
const matches = LCV_DATABASE.filter(item => item.brand === brand && item.part_type === partType && item.series === series);
const userCarModel = document.getElementById('carModel').value;
let autoMatchedIndex = -1;
matches.forEach((item, idx) => {
const opt = document.createElement('option');
opt.value = idx;
opt.textContent = 適用車型: ${item.raw_cars} (件號: ${item.part_no});
specSelect.appendChild(opt);
if (userCarModel && autoMatchedIndex === -1) {
if (item.cars.includes(userCarModel)) autoMatchedIndex = idx;
}
});
if (autoMatchedIndex !== -1) specSelect.value = autoMatchedIndex;
else if (matches.length > 0) specSelect.value = 0;
onSpecChange(partKey);
} else {
updatePartInfo(partKey);
}
} else {
// PV 模式邏輯
const seriesSelect = document.getElementById(${partKey}-series);
seriesSelect.innerHTML = '-- 請選擇系列 --';
specSelect.innerHTML = '-- 請先選系列 --';
clearVltSelects(partKey);
if (brandVal) {
const seriesList = [...new Set(
PV_DATABASE
.filter(item => item.brand === brandVal && item.part_type === partType)
.map(item => item.series)
)];
seriesList.forEach(s => {
const opt = document.createElement('option');
opt.value = s;
opt.textContent = cleanSeriesName(s);
seriesSelect.appendChild(opt);
});
}
updatePartInfo(partKey);
}
}
function clearVltSelects(partKey) {
if (partKey === 'body') {
['body-vlt-front', 'body-vlt-rear', 'body-vlt-back', 'body-vlt-single', 'body-vlt-lcv-front', 'body-vlt-lcv-rear'].forEach(id => {
const el = document.getElementById(id);
if(el) el.innerHTML = '-- 請先選規格 --';
});
} else {
const select = document.getElementById(${partKey}-vlt);
if(select) {
select.innerHTML = '-- 請先選規格 --';
if(CURRENT_MODE === 'LCV' && partKey === 'front') select.disabled = true;
}
}
}
// --- PV專用：系列選擇變更事件 ---
function onSeriesChange(partKey) {
if (CURRENT_MODE === 'LCV') return;
const brand = document.getElementById(${partKey}-brand).value;
const series = document.getElementById(${partKey}-series).value;
const specSelect = document.getElementById(${partKey}-spec);
const partType = PART_TYPES_MAP[partKey];
const userCarModel = document.getElementById('carModel').value;
specSelect.innerHTML = '-- 請選擇適用車型 --';
clearVltSelects(partKey);
if (brand && series) {
const matches = PV_DATABASE.filter(item => item.brand === brand && item.part_type === partType && item.series === series);
let autoMatchedIndex = -1;
matches.forEach((item, idx) => {
const opt = document.createElement('option');
opt.value = idx;
opt.textContent = 適用車型: ${item.raw_cars} (件號: ${item.part_no});
specSelect.appendChild(opt);
if (userCarModel && autoMatchedIndex === -1) {
if (checkModelMatch(userCarModel, item)) autoMatchedIndex = idx;
}
});
if (autoMatchedIndex !== -1) specSelect.value = autoMatchedIndex;
else if (matches.length > 0) specSelect.value = 0;
onSpecChange(partKey);
} else {
updatePartInfo(partKey);
}
}
// --- 規格選擇變更事件 ---
function onSpecChange(partKey) {
const brandVal = document.getElementById(${partKey}-brand).value;
const specIndex = document.getElementById(${partKey}-spec).value;
const partType = PART_TYPES_MAP[partKey];
clearVltSelects(partKey);
if (!brandVal || specIndex === "") {
updatePartInfo(partKey);
return;
}
if (CURRENT_MODE === 'LCV') {
const [brand, series] = brandVal.split('|');
const matches = LCV_DATABASE.filter(item => item.brand === brand && item.part_type === partType && item.series === series);
const selectedItem = matches[specIndex];
if (selectedItem) {
if (partKey === 'front') {
const select = document.getElementById('front-vlt');
select.innerHTML = <option value="${selectedItem.vlt_display}">${selectedItem.vlt_display}</option>;
select.disabled = false;
} else if (partKey === 'body') {
const frontVlts = selectedItem.front_vlts || [];
const rearVlts = selectedItem.rear_vlts || [];
['body-vlt-single', 'body-vlt-lcv-front'].forEach(id => {
const select = document.getElementById(id);
select.innerHTML = '-- 請選擇 --';
frontVlts.forEach(v => select.appendChild(new Option(v, v)));
});
const rearSelect = document.getElementById('body-vlt-lcv-rear');
rearSelect.innerHTML = '-- 請選擇 --';
rearVlts.forEach(v => rearSelect.appendChild(new Option(v, v)));
}
}
} else {
// PV 模式
const series = document.getElementById(${partKey}-series).value;
const matches = PV_DATABASE.filter(item => item.brand === brandVal && item.part_type === partType && item.series === series);
const selectedItem = matches[specIndex];
if (selectedItem) {
const allVlts = selectedItem.vlts.map(v => v.replace('%', '')).sort((a,b) => parseInt(a) - parseInt(b));
if (partKey === 'body') {
const frontVltSelect = document.getElementById('body-vlt-front');
frontVltSelect.innerHTML = '-- 請選擇 --';
const frontVlts = allVlts.filter(v => parseInt(v) >= 38);
const validFrontVlts = frontVlts.length > 0 ? frontVlts : allVlts;
validFrontVlts.forEach(v => frontVltSelect.appendChild(new Option(v, v)));
['body-vlt-rear', 'body-vlt-back'].forEach(id => {
const select = document.getElementById(id);
select.innerHTML = '-- 請選擇 --';
allVlts.forEach(v => select.appendChild(new Option(v, v)));
});
} else {
const select = document.getElementById(${partKey}-vlt);
select.innerHTML = '-- 請選擇 --';
allVlts.forEach(v => select.appendChild(new Option(v, v)));
}
}
}
updatePartInfo(partKey);
}
// --- 更新件號與警示資訊 ---
function updatePartInfo(partKey) {
const brandVal = document.getElementById(${partKey}-brand).value;
const partNoElem = document.getElementById(${partKey}-partno);
const alertElem = document.getElementById(${partKey}-alert);
const partType = PART_TYPES_MAP[partKey];
const userCarModel = document.getElementById('carModel').value;
const specIndex = document.getElementById(${partKey}-spec).value;
if (!brandVal || specIndex === "") {
if(partNoElem) partNoElem.textContent = '---';
if(alertElem) alertElem.style.display = 'none';
updateNote();
return;
}
let selectedItem = null;
if (CURRENT_MODE === 'LCV') {
const [brand, series] = brandVal.split('|');
const matches = LCV_DATABASE.filter(item => item.brand === brand && item.part_type === partType && item.series === series);
selectedItem = matches[specIndex];
} else {
const series = document.getElementById(${partKey}-series).value;
const matches = PV_DATABASE.filter(item => item.brand === brandVal && item.part_type === partType && item.series === series);
selectedItem = matches[specIndex];
}
if (selectedItem) {
partNoElem.textContent = selectedItem.part_no;
if (alertElem && CURRENT_MODE === 'PV') {
if (userCarModel) {
const isMatch = checkModelMatch(userCarModel, selectedItem);
alertElem.style.display = isMatch ? 'none' : 'block';
} else {
alertElem.style.display = 'none';
}
}
} else {
if(partNoElem) partNoElem.textContent = '---';
if(alertElem) alertElem.style.display = 'none';
}
updateNote();
}
// --- 核心優化：動態產出系統備註，未填欄位「完全不顯示該列」 ---
function updateNote() {
const vin = document.getElementById('vin').value.trim().toUpperCase();
const carModel = document.getElementById('carModel').value;
const carColor = document.getElementById('carColor').value.trim();
const agent = document.getElementById('agent').value.trim();
const location = document.getElementById('location').value.trim();
const deliveryDateRaw = document.getElementById('deliveryDate').value;
const otherInfo = document.getElementById('otherInfo').value.trim();
let lines = [];
// 必填基本資料 (只要有輸入就顯示，確保彈性)
if (vin) lines.push(車身碼：${vin});
if (carModel) lines.push(車型：${carModel});
// 【選填優化點】：如果沒填，直接不塞入 lines 陣列中
if (carColor) lines.push(車色：${carColor});
if (agent) lines.push(業代：${agent});
if (location) lines.push(存放(施工)地點：${location});
if (CURRENT_MODE === 'LCV') {
// --- LCV 卡旺 備註欄產出邏輯 ---
const frontBs = document.getElementById('front-brand').value;
if (frontBs) {
const [fBrand] = frontBs.split('|');
if (fBrand === "3M") lines.push(前擋：3M P70);
else if (fBrand === "Smith") lines.push(前擋：Smith Bella 70);
else if (fBrand === "FSK") lines.push(前擋：FSK KS78);
} else {
lines.push(前擋：);
}
const bodyBs = document.getElementById('body-brand').value;
if (bodyBs) {
const [bBrand] = bodyBs.split('|');
if (carModel === "雙廂") {
const vltFront = document.getElementById('body-vlt-lcv-front').value;
const vltRear = document.getElementById('body-vlt-lcv-rear').value;
if (bBrand === "3M") {
if (vltFront && vltFront === vltRear) lines.push(車身：3M P${vltFront});
else lines.push(車身： + [vltFront ? 前窗 3M P${vltFront} : '', vltRear ? 後窗 3M P${vltRear} : ''].filter(Boolean).join('、'));
} else if (bBrand === "Smith") {
if (vltFront && vltFront === vltRear) lines.push(車身：Bella ${vltFront});
else lines.push(車身： + [vltFront ? 前窗 Bella ${vltFront} : '', vltRear ? 後窗 Bella ${vltRear} : ''].filter(Boolean).join('、'));
} else if (bBrand === "FSK") {
if (vltFront && vltFront === vltRear) lines.push(車身：FSK KS${vltFront});
else lines.push(車身： + [vltFront ? 前窗 FSK KS${vltFront} : '', vltRear ? 後窗 FSK KS${vltRear} : ''].filter(Boolean).join('、'));
}
} else {
const vltSingle = document.getElementById('body-vlt-single').value;
if (bBrand === "3M") lines.push(車身：3M P${vltSingle});
else if (bBrand === "Smith") lines.push(車身：Bella ${vltSingle});
else if (bBrand === "FSK") lines.push(車身：FSK KS${vltSingle});
}
} else {
lines.push(車身：);
}
if (deliveryDateRaw) lines.push(交車日：${deliveryDateRaw.replace(/-/g, '/')});
if (otherInfo) lines.push(補充事項：${otherInfo});
} else {
// --- PV 乘用車 備註欄產出邏輯 ---
const frontBrand = document.getElementById('front-brand').value;
const frontSeries = cleanSeriesName(document.getElementById('front-series').value);
const frontVlt = document.getElementById('front-vlt').value;
if (frontBrand && frontSeries) {
lines.push(前擋：${frontBrand} ${frontSeries}${frontVlt ? '-' + frontVlt : ''});
}
const bodyBrand = document.getElementById('body-brand').value;
const bodySeries = cleanSeriesName(document.getElementById('body-series').value);
const vltFront = document.getElementById('body-vlt-front').value;
const vltRear = document.getElementById('body-vlt-rear').value;
const vltBack = document.getElementById('body-vlt-back').value;
if (bodyBrand && bodySeries) {
const modelName = ${bodyBrand} ${bodySeries};
if (vltFront && vltFront === vltRear && vltRear === vltBack) {
lines.push(車身：${modelName}-${vltFront});
} else {
if (vltFront) lines.push(前座：${modelName}-${vltFront});
if (vltRear) lines.push(後座：${modelName}-${vltRear});
if (vltBack) lines.push(後擋：${modelName}-${vltBack});
if (!vltFront && !vltRear && !vltBack) lines.push(車身：${modelName});
}
}
const sunroofBrand = document.getElementById('sunroof-brand').value;
const sunroofSeries = cleanSeriesName(document.getElementById('sunroof-series').value);
const sunroofVlt = document.getElementById('sunroof-vlt').value;
if (sunroofBrand && sunroofSeries) {
lines.push(天窗：${sunroofBrand} ${sunroofSeries}${sunroofVlt ? '-' + sunroofVlt : ''});
}
if (deliveryDateRaw) lines.push(交車日：${deliveryDateRaw.replace(/-/g, '/')});
if (otherInfo) lines.push(其他：${otherInfo});
}
document.getElementById('finalNote').value = lines.join('\n');
}
// --- 複製文字檢核與執行 ---
function copyText(elementId) {
if (elementId === 'finalNote') {
let missingFields = [];
const vin = document.getElementById('vin').value.trim();
const carModel = document.getElementById('carModel').value;
const agent = document.getElementById('agent').value.trim();
const location = document.getElementById('location').value.trim();
if (!vin || vin.length !== 17) missingFields.push('車身碼 (需為正確17碼)');
if (!carModel) missingFields.push('車型');
if (!agent) missingFields.push(CURRENT_MODE === 'LCV' ? '業代人員' : '業代');
if (!location) missingFields.push('存放(施工)地點');
// 隔熱紙選取完備性防呆
if (CURRENT_MODE === 'LCV') {
const frontBs = document.getElementById('front-brand').value;
const bodyBs = document.getElementById('body-brand').value;
let isBodyComplete = false;
if (carModel === "雙廂") {
isBodyComplete = bodyBs && document.getElementById('body-vlt-lcv-front').value && document.getElementById('body-vlt-lcv-rear').value;
} else {
isBodyComplete = bodyBs && document.getElementById('body-vlt-single').value;
}
if (!frontBs && !bodyBs) missingFields.push('隔熱紙型號 (【前擋】與【車身】至少需完成設定)');
else if (bodyBs && !isBodyComplete) missingFields.push('【車身】透光度未完全選擇');
} else {
const frontBrand = document.getElementById('front-brand').value;
const frontSeries = document.getElementById('front-series').value;
const frontVlt = document.getElementById('front-vlt').value;
const isFrontComplete = frontBrand && frontSeries && frontVlt;
const bodyBrand = document.getElementById('body-brand').value;
const bodySeries = document.getElementById('body-series').value;
const bodyVltFront = document.getElementById('body-vlt-front').value;
const bodyVltRear = document.getElementById('body-vlt-rear').value;
const bodyVltBack = document.getElementById('body-vlt-back').value;
const isBodySelected = bodyBrand || bodySeries || bodyVltFront || bodyVltRear || bodyVltBack;
const isBodyComplete = bodyBrand && bodySeries && bodyVltFront && bodyVltRear && bodyVltBack;
const sunroofBrand = document.getElementById('sunroof-brand').value;
const sunroofSeries = document.getElementById('sunroof-series').value;
const sunroofVlt = document.getElementById('sunroof-vlt').value;
const isSunroofComplete = sunroofBrand && sunroofSeries && sunroofVlt;
if (!isFrontComplete && !isBodySelected && !isSunroofComplete) {
missingFields.push('隔熱紙型號 (【前擋】、【車身】、【天窗】至少需完成一項設定)');
} else if (isBodySelected && !isBodyComplete) {
missingFields.push('【車身】設定未完備 (需選齊品牌、系列及三座透光度)');
}
}
if (missingFields.length > 0) {
alert('⚠️ 無法複製系統備註！請先完成以下必要欄位：\n\n' + missingFields.map((f, i) => ${i + 1}. ${f}).join('\n'));
return;
}
}
const elem = document.getElementById(elementId);
let textToCopy = (elem.tagName === 'TEXTAREA' || elem.tagName === 'INPUT') ? elem.value : elem.textContent;
if (!textToCopy || textToCopy === '---') {
alert('無內容可複製！');
return;
}
if (navigator.clipboard && window.isSecureContext) {
navigator.clipboard.writeText(textToCopy).then(() => alert('複製成功！')).catch(() => fallbackCopy(textToCopy));
} else {
fallbackCopy(textToCopy);
}
}
function fallbackCopy(text) {
const tempInput = document.createElement('textarea');
tempInput.value = text;
document.body.appendChild(tempInput);
tempInput.select();
document.execCommand('copy');
document.body.removeChild(tempInput);
alert('複製成功！');
}
